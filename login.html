<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — VetCare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <span class="logo-icon"></span>
                <span class="logo-text">VetCare</span>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="about.html" class="nav-link">О клинике</a>
                <a href="services.html" class="nav-link">Услуги и Врачи</a>
                <a href="contacts.html" class="nav-link">Контакты</a>
                <a href="login.html" class="nav-link btn-login active">Войти</a>
                <a href="register.html" class="nav-link btn-register">Регистрация</a>
            </nav>
            <button class="burger" onclick="toggleMenu()">☰</button>
        </div>
    </header>

    <section class="auth-section">
        <div class="container">
            <div class="auth-card">
                <h2 class="auth-title">Вход в систему</h2>
                <p class="auth-subtitle">Введите данные для доступа к личному кабинету</p>
                
                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" required placeholder="example@mail.ru">
                    </div>
                    
                    <div class="form-group">
                        <label for="login-password">Пароль</label>
                        <input type="password" id="login-password" name="password" required placeholder="Введите пароль">
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="login-remember" name="remember">
                        <label for="login-remember">Запомнить меня</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">Войти</button>
                </form>
                
                <div class="auth-footer">
                    <p>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 VetCare. Все права защищены.</p>
            </div>
        </div>
    </footer>

   
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
