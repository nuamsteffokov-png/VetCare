<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — VetCare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">🐾</span>
                <span class="logo-text">VetCare</span>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="about.html" class="nav-link">О клинике</a>
                <a href="services.html" class="nav-link">Услуги и Врачи</a>
                <a href="contacts.html" class="nav-link">Контакты</a>
                <a href="login.html" class="nav-link btn-login">Войти</a>
                <a href="register.html" class="nav-link btn-register active">Регистрация</a>
            </nav>
            <button class="burger" onclick="toggleMenu()">☰</button>
        </div>
    </header>

    <section class="auth-section">
        <div class="container">
            <div class="auth-card">
                <h2 class="auth-title">Регистрация</h2>
                <p class="auth-subtitle">Создайте аккаунт для доступа ко всем функциям системы</p>
                
                <form class="auth-form" id="registerForm">
                    <div class="form-group">
                        <label for="reg-fio">ФИО *</label>
                        <input type="text" id="reg-fio" name="fio" required placeholder="Иванов Иван Иванович">
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-email">Email *</label>
                        <input type="email" id="reg-email" name="email" required placeholder="example@mail.ru">
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-phone">Номер телефона *</label>
                        <input type="tel" id="reg-phone" name="phone" required placeholder="+7 (___) ___-__-__">
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-password">Пароль *</label>
                        <input type="password" id="reg-password" name="password" required placeholder="Минимум 6 символов" minlength="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-password-confirm">Подтверждение пароля *</label>
                        <input type="password" id="reg-password-confirm" name="password_confirm" required placeholder="Повторите пароль">
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="reg-agree" name="agree" required>
                        <label for="reg-agree">Я согласен с условиями использования и политикой конфиденциальности</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
                </form>
                
                <div class="auth-footer">
                    <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 VetCare. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
